# The release. A tag `vX.Y.Z` on main publishes the five Python packages to
# PyPI and the two jars to Maven Central, after the tag is checked against
# every version the tree declares: a tag that disagrees with a package
# publishes nothing.
#
# PyPI uses trusted publishing: the `pypi` environment here is registered
# with PyPI as this workflow's publisher, so there is no token to rotate.
# Maven Central needs a portal user token and a signing key, held as
# secrets on the `maven-central` environment. See docs/releasing.md.
name: publish

on:
  push:
    tags: ["v*"]
  # A rehearsal: the same build, uploaded to TestPyPI, from any ref. Maven
  # Central has no test index, so that job stays out of a rehearsal.
  workflow_dispatch:
    inputs:
      rehearse:
        description: "Upload to TestPyPI instead of PyPI"
        type: boolean
        default: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # Releases come from `release`, never from `main`: a tag that is not on
      # that branch, or a manual run from any other branch, stops here.
      - name: The tag must be on the release branch
        run: |
          git fetch --no-tags --depth=200 origin release
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/release; then
            echo "$GITHUB_SHA is on release"
          else
            echo "::error::$GITHUB_REF_NAME is not on the release branch; release from release, not main"
            exit 1
          fi
      - name: Every declared version must equal the tag
        if: github.event_name == 'push'
        run: |
          want="${GITHUB_REF_NAME#v}"
          bad=0
          for f in python/src/convalesce_emit/_version.py python/plugins/*/src/*/_version.py; do
            have=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' "$f")
            echo "$f: $have"
            [ "$have" = "$want" ] || bad=1
          done
          have=$(sed -n "s/^  version = '\(.*\)'/\1/p" java/build.gradle)
          echo "java/build.gradle: $have"
          [ "$have" = "$want" ] || bad=1
          # The jar reports this one on every observation it sends, as
          # `client_version` and in the User-Agent, so a stale value here is
          # a lie in the data rather than a mislabelled file.
          java_version="java/emit-core/src/main/java/io/convalesce/emit/Version.java"
          have=$(sed -n 's/.*String VERSION = "\(.*\)";/\1/p' "$java_version")
          echo "$java_version: $have"
          [ "$have" = "$want" ] || bad=1
          test "$bad" = 0

  pypi:
    needs: check-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One GitHub environment per package, because PyPI allows one
          # pending publisher per owner, repository, workflow and
          # environment: five packages cannot share `pypi` until they exist.
          - { package: convalesce-emit, dir: ".", env: "" }
          - { package: convalesce-emit-airflow, dir: plugins/airflow, env: "-airflow" }
          - { package: convalesce-emit-dagster, dir: plugins/dagster, env: "-dagster" }
          - { package: convalesce-emit-prefect, dir: plugins/prefect, env: "-prefect" }
          - { package: convalesce-emit-gx, dir: plugins/gx, env: "-gx" }
    name: ${{ matrix.package }}
    environment: ${{ inputs.rehearse && 'testpypi' || 'pypi' }}${{ matrix.env }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Build the distribution
        working-directory: python
        run: |
          python -m build --outdir ../dist "${{ matrix.dir }}"
          twine check ../dist/*
          ls -l ../dist
      # skip-existing makes a rerun of the whole workflow safe: a file PyPI
      # already holds is skipped, not rejected, so the Maven job can be run
      # again on its own after its secrets arrive.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: ${{ inputs.rehearse && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: true
          verbose: true

  maven-central:
    needs: check-version
    # On a tag, and on a manual run that is not a rehearsal: Central has no
    # test index, so a rehearsal never touches it.
    if: github.event_name == 'push' || !inputs.rehearse
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
      # Central needs a verified namespace, a token and a signing key. Until
      # those exist the Python packages can still ship; this job says so and
      # stops rather than failing the release on a missing secret.
      - name: Stop unless Central is configured
        id: configured
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$CENTRAL_USERNAME" ] || [ -z "$SIGNING_KEY" ]; then
            echo "::notice::Maven Central secrets are not set; skipping. See docs/releasing.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.configured.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.configured.outputs.ready == 'true'
      - name: Build, check and publish the signed jars
        if: steps.configured.outputs.ready == 'true'
        working-directory: java
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew build publish
      # The staging API holds an upload in a repository the portal cannot
      # see until it is handed over. This moves it to the portal's
      # Deployments page as a user-managed deployment: validated there,
      # released by a click. `automatic` instead would release on its own.
      - name: Hand the staged repository to the portal
        if: steps.configured.outputs.ready == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          code=$(curl -s -o /tmp/upload.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.convalesce?publishing_type=user_managed")
          echo "portal answered HTTP $code"; cat /tmp/upload.out; echo
          test "$code" = 200

  github-release:
    needs: [pypi, maven-central]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
