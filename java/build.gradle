// Java 8 bytecode on purpose.
//
// Plenty of Spark 3.x clusters still run Java 8 or 11 -- EMR 6.x, Databricks 15.4 LTS and below,
// older Glue. A dependency-free forwarder has no reason to impose a JVM floor on the job it is
// watching, so this targets the widest one and gives up records and `var` to do it.
subprojects {
  apply plugin: 'java-library'
  apply plugin: 'maven-publish'
  apply plugin: 'signing'
  apply plugin: 'com.diffplug.spotless'

  group = 'io.convalesce'
  version = '0.1.0'
  // Artifact ids carry the product name; the Gradle project names do not have to.
  base.archivesName = "convalesce-${project.name}"


  repositories {
    mavenCentral()
  }

  java {
    withJavadocJar()
    withSourcesJar()
  }

  tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all' << '-Werror'
  }

  tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    // The Java 8 target means no module info; doclint would object to nothing here but the build
    // should not fail on a missing @return in a getter either.
    options.addStringOption('Xdoclint:none', '-quiet')
  }

  spotless {
    java {
      googleJavaFormat()
      target 'src/**/*.java'
    }
  }

  dependencies {
    testImplementation 'junit:junit:4.13.2'
  }

  tasks.withType(Test).configureEach {
    useJUnit()
    testLogging {
      exceptionFormat = 'full'
    }
  }

  publishing {
    publications {
      maven(MavenPublication) {
        from components.java
        // The artifactId is what a customer types; the Gradle project name is not.
        // `base.archivesName` only renames the file, so without this the coordinate
        // published is io.convalesce:emit-spark while every doc says
        // io.convalesce:convalesce-emit-spark.
        artifactId = "convalesce-${project.name}"
        pom {
          url = 'https://github.com/convalesce/emit'
          licenses {
            license {
              name = 'Apache License, Version 2.0'
              url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
          }
          developers {
            developer {
              name = 'Convalesce'
            }
          }
          scm {
            url = 'https://github.com/convalesce/emit'
            connection = 'scm:git:https://github.com/convalesce/emit.git'
            developerConnection = 'scm:git:ssh://git@github.com/convalesce/emit.git'
          }
        }
      }
    }
  }

  publishing.repositories {
    // Maven Central's compatibility endpoint for plain maven-publish. A
    // deployment lands in a staging bucket the portal shows; releasing it is
    // one click there, or the `manual` flag below flipped to `automatic`.
    // Credentials are a Central portal user token, never a login.
    maven {
      name = 'central'
      url = 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
      credentials {
        username = findProperty('centralUsername') ?: System.getenv('CENTRAL_USERNAME')
        password = findProperty('centralPassword') ?: System.getenv('CENTRAL_PASSWORD')
      }
    }
  }

  signing {
    // Only when a key is configured, so a local build never asks for one.
    required { gradle.taskGraph.hasTask('publish') }
    // An armoured private key from the environment, which is how CI holds
    // one; a keyring on disk is the default when these are unset.
    def signingKey = findProperty('signingKey') ?: System.getenv('SIGNING_KEY')
    def signingPassword = findProperty('signingPassword') ?: System.getenv('SIGNING_PASSWORD')
    if (signingKey) {
      useInMemoryPgpKeys(signingKey, signingPassword)
    }
    sign publishing.publications.maven
  }
}
