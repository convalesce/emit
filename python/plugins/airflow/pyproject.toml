[project]
name = "convalesce-emit-airflow"
dynamic = ["version"]
description = "Forward Airflow run and lineage events to Convalesce."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Convalesce" }]
# The host tool is deliberately not a dependency: this installs into an
# existing one, and pinning it would fight that environment's resolution.
# Its OpenLineage provider is not one either, for the same reason, and is
# carried instead (see `carried.py`). What that copy needs and cannot carry
# is the SQL parser: compiled, and with no requirements of its own.
requires-python = ">=3.9"
dependencies = ["convalesce-emit>=0.1.8,<1", "openlineage-sql>=1.4"]

[project.entry-points."airflow.plugins"]
convalesce_emit = "convalesce_emit_airflow.plugin:ConvalescePlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/convalesce_emit_airflow/_version.py"

[tool.hatch.build.targets.sdist]
# Only this package. Without it hatch ships everything under the
# project directory, which for the core is every plugin and its tests.
only-include = ["src/convalesce_emit_airflow"]

[tool.hatch.build.targets.wheel]
packages = ["src/convalesce_emit_airflow"]

# Tests live beside the code, as they do across these repos, but a package
# installed into a customer's Airflow has no use for them.
exclude = ["**/test/**"]

[tool.black]
line-length = 81
target-version = ["py39"]
