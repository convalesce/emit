[project]
name = "convalesce-emit-pyspark"
dynamic = ["version"]
description = "Report a PySpark driver that fails in Python to Convalesce."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Convalesce" }]
# The host tool is deliberately not a dependency: this installs into an
# existing one, and pinning it would fight that environment's resolution.
requires-python = ">=3.9"
dependencies = ["convalesce-emit>=0.1,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/convalesce_emit_pyspark/_version.py"

[tool.hatch.build.targets.sdist]
# Only this package. Without it hatch ships everything under the
# project directory, which for the core is every plugin and its tests.
only-include = ["src/convalesce_emit_pyspark"]

[tool.hatch.build.targets.wheel]
packages = ["src/convalesce_emit_pyspark"]

# Tests live beside the code, as they do across these repos, but a package
# installed into a customer's driver has no use for them.
exclude = ["**/test/**", "**/*.pth"]

# At the wheel's root, so site-packages runs it at interpreter start: that is
# what hooks a driver nobody edited. It hooks nothing unless
# CONVALESCE_PYSPARK_DRIVER_HOOK is true.
[tool.hatch.build.targets.wheel.force-include]
"src/convalesce_emit_pyspark/convalesce_emit_pyspark.pth" = "convalesce_emit_pyspark.pth"

[tool.black]
line-length = 81
target-version = ["py39"]
