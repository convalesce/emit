[project]
name = "convalesce-emit-prefect"
version = "0.1.0"
description = "Forward Prefect flow and task run state to Convalesce."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Convalesce" }]
# The host tool is deliberately not a dependency: this installs into an
# existing one, and pinning it would fight that environment's resolution.
requires-python = ">=3.9"
dependencies = ["convalesce-emit~=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/convalesce_emit_prefect"]

# Tests live beside the code, as they do across these repos, but a package
# installed into a customer's Airflow has no use for them.
exclude = ["**/test/**"]

[tool.black]
line-length = 81
target-version = ["py39"]
